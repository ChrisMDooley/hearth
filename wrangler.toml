# Cloudflare Worker: serves the app from dist/ and the family API under /api.
# Cloudflare's Git build runs `npm run build`, then `npx wrangler deploy` with this file.
name = "hearth"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "hearth"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "hearth-photos"

# Optional, recommended once Access is on: verify the signed login token too.
# [vars]
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# ACCESS_AUD = "…"
